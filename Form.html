<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>

    <style>
        .booking-form {
            width: 420px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid black;
            text-align: center;
            font-family: "Times New Roman", serif;
        }

        .booking-form h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .form-row {
            margin: 12px 0;
        }

        label {
            display: inline-block;
            margin-right: 5px;
        }

        input, select, textarea {
            box-sizing: border-box;
        }

        .text-input {
            width: 160px;
        }

        .date-input {
            width: 110px;
        }

        .guest-input {
            width: 65px;
        }

        textarea {
            width: 315px;
            height: 63px;
            display: block;
            margin: 0 auto 15px;
        }

        button {
            margin: 0 2px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="booking-form">
        <h1>Hotel Room Booking Form</h1>

        <form onsubmit="event.preventDefault(); alert('Booking submitted successfully!');">

            <div class="form-row">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                       class="text-input" required>
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       class="text-input" required>
            </div>

            <div class="form-row">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone"
                       class="text-input" required>
            </div>

            <div class="form-row">
                <label for="checkin">Check-in Date:</label>
                <input type="date" id="checkin" name="checkin"
                       class="date-input" required>
            </div>

            <div class="form-row">
                <label for="checkout">Check-out Date:</label>
                <input type="date" id="checkout" name="checkout"
                       class="date-input" required>
            </div>

            <div class="form-row">
                <label for="room">Room Type:</label>
                <select id="room" name="room">
                    <option value="single">Single Room</option>
                    <option value="double">Double Room</option>
                    <option value="suite">Suite</option>
                    <option value="deluxe">Deluxe Room</option>
                </select>
            </div>

            <div class="form-row">
                <label for="guests">Number of Guests:</label>
                <input type="number" id="guests" name="guests"
                       class="guest-input" min="1" required>
            </div>

            <div>
                <label for="requests">Special Requests:</label>
                <textarea id="requests" name="requests"></textarea>
            </div>

            <button type="submit">Book Now</button>
            <button type="reset">Reset Form</button>

        </form>
    </div>

</body>
</html>
